spring:
  application:
    name: facturacion-gen-secuencias-hilos
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/facturacion
    username: postgres
    password: postgrespassword
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 30000
      pool-name: FacturacionHikariPool

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

simulacion:
  demora-secuencia-ms: 300
  demora-validacion-min-ms: 10
  demora-validacion-max-ms: 30
  max-secuencias-concurrentes: 8
  max-detalles-concurrentes: 10

